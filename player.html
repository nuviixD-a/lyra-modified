    <script>
      (function () {
        const recoveryUrl = new URL(window.location.href);
        let recoveryAttempted = recoveryUrl.searchParams.has("lyra-recovery");

        window.__lyraRecoverAsset = function () {
          if (recoveryAttempted) return;
          recoveryAttempted = true;
          const target = new URL(window.location.href);
          target.searchParams.set("lyra-recovery", "1");
          window.location.replace(target.href);
        };
        window.addEventListener(
          "vite:preloadError",
          function (event) {
            event.preventDefault();
            window.__lyraRecoverAsset();
          },
          { once: true },
        );
        window.addEventListener(
          "error",
          function (event) {
            const element = event.target;
            const tagName = element?.tagName?.toLowerCase();
            const assetUrl =
              tagName === "script"
                ? element.src
                : tagName === "link" &&
                    (element.rel === "modulepreload" ||
                      element.rel === "stylesheet")
                  ? element.href
                  : "";
            if (!assetUrl) return;
            const failedUrl = new URL(assetUrl, window.location.href);
            if (
              failedUrl.origin === window.location.origin &&
              /^\/assets\/[a-f0-9]{12}\/[^/]+$/.test(failedUrl.pathname)
            ) {
              window.__lyraRecoverAsset();
            }
          },
          true,
        );
      })();
    </script>
